name: Static quality checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate static site
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Check JavaScript syntax
        run: |
          node --check js/performance.js
          node --check sw.js
          node --check app.js
          node --check js/workspace.js
          node --check js/component-inspector.js
          node --check js/supabase-catalogue.js
          node --check js/selection-tools.js
          node --check scripts/validate-site.mjs
          node --check scripts/test-compatibility.mjs
          node --check scripts/test-completeness.mjs
          node --check scripts/test-component-catalogue.mjs
          node --check scripts/test-build-restore.mjs
          node --check scripts/test-selection-tools.mjs
          node --check scripts/test-renderer-quality.mjs
          node --check scripts/test-catalogue-meshes.mjs
          python3 -m py_compile scripts/generate-catalogue-meshes.py
      - name: Validate pages, local assets, and parts catalogue
        run: |
          node scripts/test-performance-support.mjs
          node scripts/validate-site.mjs
          node scripts/test-compatibility.mjs
          node scripts/test-completeness.mjs
          node scripts/test-component-catalogue.mjs
          node scripts/test-build-restore.mjs
          node scripts/test-selection-tools.mjs
          node scripts/test-renderer-quality.mjs
          python3 scripts/generate-catalogue-meshes.py
          node scripts/test-catalogue-meshes.mjs
